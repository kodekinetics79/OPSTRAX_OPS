services:
  mysql:
    image: mysql:8.4
    container_name: opstrax-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-opstrax_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opstrax}
      MYSQL_USER: ${MYSQL_USER:-opstrax_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opstrax_password}
    # MySQL is intentionally NOT exposed to the host to avoid 3306/3307 port conflicts.
    # Other containers connect internally using mysql:3306.
    volumes:
      - opstrax_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api-dotnet:
    build:
      context: ./api-dotnet
      dockerfile: Dockerfile
    container_name: opstrax-dotnet-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${MYSQL_CONNECTION:-Server=mysql;Port=3306;Database=opstrax;User=opstrax_user;Password=opstrax_password;Allow User Variables=True;}
      Cors__AllowedOrigins__0: http://localhost:${FRONTEND_PORT:-10000}
    ports:
      - "${DOTNET_API_PORT:-8088}:8080"
    depends_on:
      mysql:
        condition: service_healthy

  node-events:
    build:
      context: ./node-services/events
      dockerfile: Dockerfile
    container_name: opstrax-node-events
    restart: unless-stopped
    environment:
      PORT: 8090
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-opstrax}
      MYSQL_USER: ${MYSQL_USER:-opstrax_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-opstrax_password}
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-10000}
    ports:
      - "${NODE_EVENTS_PORT:-8090}:8090"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: opstrax-frontend
    restart: unless-stopped
    environment:
      VITE_DOTNET_API_URL: ${VITE_DOTNET_API_URL:-http://localhost:8088}
      VITE_NODE_EVENTS_URL: ${VITE_NODE_EVENTS_URL:-http://localhost:8090}
    ports:
      - "${FRONTEND_PORT:-10000}:10000"
    depends_on:
      - api-dotnet
      - node-events

volumes:
  opstrax_mysql_data:
