services:
  frontend:
    container_name: opstrax-frontend
    build: ./frontend
    ports:
      - "10000:80"
    depends_on:
      - api-dotnet
      - node-events

  api-dotnet:
    container_name: opstrax-dotnet-api
    build: ./backend-dotnet
    ports:
      - "8088:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=server=mysql;port=3306;database=opstrax;user=opstrax;password=opstraxpass
      - Cors__AllowedOrigins=http://localhost:10000
      - Jwt__Issuer=OpsTrax
      - Jwt__Audience=OpsTraxEnterprise
      - Jwt__Key=opstrax-demo-local-development-key-change-me
    depends_on:
      mysql:
        condition: service_healthy

  node-events:
    container_name: opstrax-node-events
    build: ./services/node-events
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - API_BASE_URL=http://api-dotnet:8080
      - CORS_ORIGIN=http://localhost:10000

  mysql:
    container_name: opstrax-mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: opstrax
      MYSQL_USER: opstrax
      MYSQL_PASSWORD: opstraxpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
