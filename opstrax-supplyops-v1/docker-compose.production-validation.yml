services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opstrax
      POSTGRES_USER: opstrax
      POSTGRES_PASSWORD: opstrax
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opstrax -d opstrax"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opstrax
      MINIO_ROOT_PASSWORD: opstrax-secret
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - >-
        set -eu;
        mc alias set local http://minio:9000 opstrax opstrax-secret;
        mc mb -p local/opstrax-evidence || true;
        mc anonymous set private local/opstrax-evidence || true

  seed:
    image: node:24-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      NODE_ENV: production
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://opstrax:opstrax@postgres:5432/opstrax
      EVIDENCE_STORAGE_PROVIDER: s3
      S3_BUCKET: opstrax-evidence
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: opstrax
      S3_SECRET_ACCESS_KEY: opstrax-secret
      EVIDENCE_SIGNING_SECRET: opstrax-validation-signing-secret
      AUTH_MODE: oidc
      SESSION_SECRET: opstrax-tenant-session-secret
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      OIDC_ISSUER: https://tenant-idp.example.com
      OIDC_CLIENT_ID: opstrax-tenant-client
      OIDC_CLIENT_SECRET: opstrax-tenant-secret
      OIDC_REDIRECT_URI: http://localhost:9900/auth/oidc/callback
      OIDC_LOGOUT_REDIRECT_URI: http://localhost:9900/auth/login
      PLATFORM_AUTH_MODE: oidc
      PLATFORM_SESSION_SECRET: opstrax-platform-session-secret
      PLATFORM_OIDC_ISSUER: https://platform-idp.example.com
      PLATFORM_OIDC_CLIENT_ID: opstrax-platform-client
      PLATFORM_OIDC_CLIENT_SECRET: opstrax-platform-secret
      PLATFORM_OIDC_REDIRECT_URI: http://localhost:9900/platform/auth/oidc/callback
      PLATFORM_OIDC_LOGOUT_REDIRECT_URI: http://localhost:9900/platform/login
      OPSTRAX_VALIDATE_SEED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -lc "node scripts/seed-production-runtime.mjs"

  app:
    image: node:24-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      NODE_ENV: production
      PORT: 9900
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://opstrax:opstrax@postgres:5432/opstrax
      EVIDENCE_STORAGE_PROVIDER: s3
      S3_BUCKET: opstrax-evidence
      S3_REGION: us-east-1
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: opstrax
      S3_SECRET_ACCESS_KEY: opstrax-secret
      EVIDENCE_SIGNING_SECRET: opstrax-validation-signing-secret
      AUTH_MODE: oidc
      SESSION_SECRET: opstrax-tenant-session-secret
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      OIDC_ISSUER: https://tenant-idp.example.com
      OIDC_CLIENT_ID: opstrax-tenant-client
      OIDC_CLIENT_SECRET: opstrax-tenant-secret
      OIDC_REDIRECT_URI: http://localhost:9900/auth/oidc/callback
      OIDC_LOGOUT_REDIRECT_URI: http://localhost:9900/auth/login
      PLATFORM_AUTH_MODE: oidc
      PLATFORM_SESSION_SECRET: opstrax-platform-session-secret
      PLATFORM_OIDC_ISSUER: https://platform-idp.example.com
      PLATFORM_OIDC_CLIENT_ID: opstrax-platform-client
      PLATFORM_OIDC_CLIENT_SECRET: opstrax-platform-secret
      PLATFORM_OIDC_REDIRECT_URI: http://localhost:9900/platform/auth/oidc/callback
      PLATFORM_OIDC_LOGOUT_REDIRECT_URI: http://localhost:9900/platform/login
      OPSTRAX_WORKER_TIMEOUT_MS: "30000"
    ports:
      - "9900:9900"
    depends_on:
      seed:
        condition: service_completed_successfully
    command: sh -lc "node server.js"
