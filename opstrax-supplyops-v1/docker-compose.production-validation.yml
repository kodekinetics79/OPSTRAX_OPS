services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opstrax
      POSTGRES_USER: opstrax
      POSTGRES_PASSWORD: opstrax
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opstrax -d opstrax"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opstrax
      MINIO_ROOT_PASSWORD: opstrax-secret
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - >-
        set -eu;
        mc alias set local http://minio:9000 opstrax opstrax-secret;
        mc mb -p local/opstrax-evidence || true;
        mc anonymous set private local/opstrax-evidence || true

  seed:
    image: node:24-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      NODE_ENV: production
      OPSTRAX_DB_PROVIDER: postgres
      DATABASE_URL: postgresql://opstrax:opstrax@postgres:5432/opstrax
      OPSTRAX_EVIDENCE_STORAGE: s3
      OPSTRAX_EVIDENCE_BUCKET: opstrax-evidence
      OPSTRAX_EVIDENCE_REGION: us-east-1
      OPSTRAX_EVIDENCE_ENDPOINT: http://minio:9000
      OPSTRAX_EVIDENCE_FORCE_PATH_STYLE: "true"
      OPSTRAX_EVIDENCE_ACCESS_KEY_ID: opstrax
      OPSTRAX_EVIDENCE_SECRET_ACCESS_KEY: opstrax-secret
      OPSTRAX_EVIDENCE_SIGNING_SECRET: opstrax-validation-signing-secret
      OPSTRAX_VALIDATE_SEED: "1"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -lc "node scripts/seed-production-runtime.mjs"

  app:
    image: node:24-bookworm-slim
    working_dir: /workspace
    volumes:
      - ./:/workspace
    environment:
      NODE_ENV: production
      PORT: 9900
      OPSTRAX_DB_PROVIDER: postgres
      DATABASE_URL: postgresql://opstrax:opstrax@postgres:5432/opstrax
      OPSTRAX_EVIDENCE_STORAGE: s3
      OPSTRAX_EVIDENCE_BUCKET: opstrax-evidence
      OPSTRAX_EVIDENCE_REGION: us-east-1
      OPSTRAX_EVIDENCE_ENDPOINT: http://minio:9000
      OPSTRAX_EVIDENCE_FORCE_PATH_STYLE: "true"
      OPSTRAX_EVIDENCE_ACCESS_KEY_ID: opstrax
      OPSTRAX_EVIDENCE_SECRET_ACCESS_KEY: opstrax-secret
      OPSTRAX_EVIDENCE_SIGNING_SECRET: opstrax-validation-signing-secret
      OPSTRAX_AUTH_MODE: locked
      OPSTRAX_ALLOW_DEV_CONTEXT: "0"
      OPSTRAX_WORKER_TIMEOUT_MS: "30000"
    ports:
      - "9900:9900"
    depends_on:
      seed:
        condition: service_completed_successfully
    command: sh -lc "node server.js"
