name: WMS Certification

on:
  push:
    branches: ["agent/opstrax-enterprise-wms", "opstrax-phase-2e-p2p-intelligence"]
  pull_request:
    paths:
      - "opstrax-supplyops-v1/**"
      - ".github/workflows/wms-certification.yml"

concurrency:
  group: wms-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: opstrax-supplyops-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Syntax-check WMS overlay
        run: |
          node --check wms-server.js
          node --check warehouse-console.js
          node --check warehouse-ux.js
          node --check src/wms.js
          node --check src/wms-safety.js
          node --check src/wms-engine.js
          node --check src/wms-schema.js
          node --check tests/wms-engine.test.mjs
          node --check tests/wms-http.test.mjs
      - name: WMS domain and integration tests
        run: node --test tests/wms-engine.test.mjs tests/wms-http.test.mjs
      - name: Verify migration 29
        run: npm run verify-migration
        env:
          OPSTRAX_ALLOW_DEV_CONTEXT: "1"
      - run: npm run build
      - name: Verify WMS assets
        run: test -f dist/warehouse.html && test -f dist/warehouse-console.js && test -f dist/warehouse-ux.js && test -f dist/warehouse.css
